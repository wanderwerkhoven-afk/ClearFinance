name: Research rebuild validation
on:
  push:
    branches: [research-rebuild]
    paths: ["research_v2/**", ".github/workflows/research-rebuild-tests.yml"]
  pull_request:
    paths: ["research_v2/**", ".github/workflows/research-rebuild-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r research_v2/requirements.txt
      - run: python -m pytest -q research_v2/tests
      - run: python -m research_v2.demo --out /tmp/clearfinance-demo
      - uses: actions/upload-artifact@v4
        with:
          name: clearfinance-evaluation-demo
          path: /tmp/clearfinance-demo

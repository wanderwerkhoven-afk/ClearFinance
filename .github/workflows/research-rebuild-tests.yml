name: Research rebuild validation
on:
  push:
    branches: [research-rebuild]
    paths: ["research_v2/**", ".github/workflows/research-rebuild-tests.yml"]
  pull_request:
    paths: ["research_v2/**", ".github/workflows/research-rebuild-tests.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q research_v2/tests
      - run: python -m research_v2.cli --input research_v2/fixtures/synthetic_report.json --out /tmp/research_v2_first_run
